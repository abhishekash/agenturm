[package]
name = "agenturm-content"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"
[dependencies]
agenturm-kernel = { path = "../agenturm-kernel" }
agenturm-store = { path = "../agenturm-store" }
agenturm-jsonl-source = { path = "../agenturm-jsonl-source" }
agenturm-opencode-harness = { path = "../agenturm-opencode-harness" }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2.0"
time = { version = "0.3", features = ["parsing"] }

[package]
name = "agenturm-app"
version = "0.3.9"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[dependencies]
agenturm-kernel = { path = "../agenturm-kernel" }
agenturm-runtime = { path = "../agenturm-runtime" }
agenturm-service = { path = "../agenturm-service" }
agenturm-store = { path = "../agenturm-store" }
agenturm-ui = { path = "../agenturm-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-segmentation = "1.12"
signal-hook = "0.3"
time = { version = "0.3", features = ["parsing", "local-offset"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = { version = "0.3", features = ["extended-siginfo"] }

[target.'cfg(target_os = "linux")'.dependencies]
agenturm-content = { path = "../agenturm-content" }
agenturm-storage-service = { path = "../agenturm-storage-service" }
agenturm-jsonl-source = { path = "../agenturm-jsonl-source" }
agenturm-opencode-harness = { path = "../agenturm-opencode-harness" }
rustix = { version = "1.1", features = ["fs"] }
time = { version = "0.3", features = ["parsing", "local-offset"] }

[dev-dependencies]
agenturm-lifecycle-extension-example = { path = "../../examples/rust_lifecycle_extension" }
rusqlite = { version = "0.37", features = ["bundled"] }

[lib]
name = "agenturm_app"
path = "src/lib.rs"

[[bin]]
name = "agenturm"
path = "src/main.rs"

[package]
name = "agenturm-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[dependencies]
agenturm-kernel = { path = "../agenturm-kernel" }
agenturm-protocol = { path = "../agenturm-protocol" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
agenturm-store = { path = "../agenturm-store" }


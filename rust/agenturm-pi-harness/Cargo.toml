[package]
name = "agenturm-pi-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[dependencies]
agenturm-directory-source = { path = "../agenturm-directory-source" }
agenturm-jsonl-source = { path = "../agenturm-jsonl-source" }
agenturm-source-process = { path = "../agenturm-source-process" }
serde_json = "1.0"
serde = "1.0"
sha2 = "0.10"
libc = "0.2"
time = { version = "0.3", features = ["parsing"] }

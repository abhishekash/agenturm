[package]
name = "agenturm-storage-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[dependencies]
agenturm-kernel = { path = "../agenturm-kernel" }
agenturm-storage-admission = { path = "../agenturm-storage-admission" }
agenturm-storage-service-contract = { path = "../agenturm-storage-service-contract" }
agenturm-store = { path = "../agenturm-store" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
agenturm-content = { path = "../agenturm-content" }
agenturm-runtime = { path = "../agenturm-runtime" }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10"

[[bin]]
name = "agenturm-storage-service"
path = "src/main.rs"

[package]
name = "agenturm-loopback-inbound-connector"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[[bin]]
name = "agenturm-loopback-inbound-connector"
path = "src/main.rs"

[dependencies]
agenturm-source-process = { path = "../agenturm-source-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"

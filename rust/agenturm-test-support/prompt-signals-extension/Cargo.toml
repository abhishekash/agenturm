[package]
name = "agenturm-prompt-signals-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[dependencies]
agenturm-protocol = { path = "../../agenturm-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
agenturm-kernel = { path = "../../agenturm-kernel" }
agenturm-runtime = { path = "../../agenturm-runtime" }
sha2 = "0.10"

[[bin]]
name = "agenturm-prompt-signals-extension"
path = "src/main.rs"

[package]
name = "agenturm-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[dependencies]
agenturm-kernel = { path = "../agenturm-kernel" }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1.0"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "termios"] }

[dev-dependencies]
agenturm-lifecycle-extension-example = { path = "../../examples/rust_lifecycle_extension" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.6", features = ["pipe"] }

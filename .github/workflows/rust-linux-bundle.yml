name: Rust Linux bundle

on:
  pull_request:
  push:
    branches: [main]
    tags: ["rust-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bundle:
    name: Build and verify Linux x86_64 bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native cockpit frame parsers
        run: |
          python3 -m unittest discover -s tests -p 'test_rust_default_cockpit_validation.py'
          python3 -m unittest discover -s tests -p 'test_rust_roster_witness.py'
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build standalone Rust bundle
        run: |
          scripts/build-rust-linux-bundle.sh "$RUNNER_TEMP/agenturm-rust-bundle"
          git rev-parse HEAD > "$RUNNER_TEMP/agenturm-rust-bundle/source-commit.txt"
      - name: Qualify the extracted bundle
        shell: bash
        run: |
          set -euo pipefail
          archives=("$RUNNER_TEMP"/agenturm-rust-bundle/agenturm-*-linux-x86_64.tar.gz)
          [[ ${#archives[@]} -eq 1 && -f ${archives[0]} ]]
          archive=${archives[0]}
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            expected="agenturm-${GITHUB_REF_NAME#rust-v}-linux-x86_64.tar.gz"
            if [[ ${archive##*/} != "$expected" ]]; then
              echo "Rust tag $GITHUB_REF_NAME does not match ${archive##*/}" >&2
              exit 1
            fi
          fi
          scripts/verify-rust-linux-bundle.sh "$archive"
          scripts/verify-rust-installer.sh "$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agenturm-rust-linux-x86_64
          path: ${{ runner.temp }}/agenturm-rust-bundle/
          if-no-files-found: error
          compression-level: 0

  publish-x86_64:
    name: Attach qualified Linux x86_64 release archive
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/rust-v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agenturm-rust-linux-x86_64
          path: release
      - name: Attach the exact qualified archive without replacing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          asset="agenturm-${GITHUB_REF_NAME#rust-v}-linux-x86_64.tar.gz"
          [[ -f $asset && -f $asset.sha256 && -f source-commit.txt ]]
          sha256sum --check "$asset.sha256"
          expected_commit=$(cat source-commit.txt)
          [[ $expected_commit =~ ^[0-9a-f]{40}$ ]]
          live_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          [[ $live_commit == "$expected_commit" ]] || {
            echo 'Release tag moved after Linux archive qualification' >&2
            exit 1
          }
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --latest=false \
              --title "Agenturm Rust ${GITHUB_REF_NAME#rust-v}" \
              --notes 'Native Linux and Apple Silicon archives. Apple Silicon requires macOS 13+; Intel Macs are not supported.' \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          for file in "$asset" "$asset.sha256"; do
            digest="sha256:$(sha256sum -- "$file" | cut -d ' ' -f 1)"
            existing=$(gh release view "$GITHUB_REF_NAME" --json assets \
              --jq ".assets[] | select(.name == \"$file\") | .digest")
            if [[ -n $existing ]]; then
              [[ $existing == "$digest" ]] || {
                echo "Existing release asset has different bytes: $file" >&2
                exit 1
              }
              echo "Verified existing release asset: $file"
            else
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done

  bundle-arm64:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    name: Qualify Linux arm64 candidate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: rust-v0.2.0
          path: prior-rust-release
          persist-credentials: false
      - name: Verify native cockpit frame parsers
        run: |
          python3 -m unittest discover -s tests -p 'test_rust_default_cockpit_validation.py'
          python3 -m unittest discover -s tests -p 'test_rust_roster_witness.py'
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build native candidate and prior Rust baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ $(uname -m) == aarch64 ]]
          CARGO_TARGET_DIR="$RUNNER_TEMP/agenturm-arm64-prior-target" \
            prior-rust-release/scripts/build-rust-linux-bundle.sh "$RUNNER_TEMP/agenturm-arm64-prior"
          CARGO_TARGET_DIR="$RUNNER_TEMP/agenturm-arm64-candidate-target" \
            scripts/build-rust-linux-bundle.sh "$RUNNER_TEMP/agenturm-arm64-candidate"
          git rev-parse HEAD > "$RUNNER_TEMP/agenturm-arm64-candidate/source-commit.txt"
      - name: Qualify the arm64 archive and Linux user service
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          for attempt in {1..30}; do
            if systemctl --user show-environment >/dev/null; then
              break
            fi
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          archives=("$RUNNER_TEMP"/agenturm-arm64-candidate/agenturm-*-linux-aarch64.tar.gz)
          [[ ${#archives[@]} -eq 1 && -f ${archives[0]} ]]
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            expected="agenturm-${GITHUB_REF_NAME#rust-v}-linux-aarch64.tar.gz"
            [[ ${archives[0]##*/} == "$expected" ]]
          fi
          scripts/verify-rust-linux-bundle.sh "${archives[0]}" \
            --previous "$RUNNER_TEMP/agenturm-arm64-prior/agenturm-0.2.0-linux-aarch64.tar.gz" \
            --systemd-user
          scripts/verify-rust-installer.sh "${archives[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agenturm-rust-linux-aarch64-qualification
          path: ${{ runner.temp }}/agenturm-arm64-candidate/
          if-no-files-found: error
          compression-level: 0

  publish-arm64:
    name: Attach qualified arm64 release archive
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/rust-v')
    needs: [bundle, bundle-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agenturm-rust-linux-aarch64-qualification
          path: release
      - name: Attach the exact qualified archive without replacing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          asset="agenturm-${GITHUB_REF_NAME#rust-v}-linux-aarch64.tar.gz"
          [[ -f $asset && -f $asset.sha256 ]]
          sha256sum --check "$asset.sha256"
          expected_commit=$(cat source-commit.txt)
          [[ $expected_commit =~ ^[0-9a-f]{40}$ ]]
          live_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          if [[ $live_commit != "$expected_commit" ]]; then
            echo 'Release tag moved after archive qualification' >&2
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --latest=false \
              --title "Agenturm Rust ${GITHUB_REF_NAME#rust-v}" \
              --notes 'Native Linux and Apple Silicon archives. Apple Silicon requires macOS 13+; Intel Macs are not supported.' \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          for file in "$asset" "$asset.sha256"; do
            digest="sha256:$(sha256sum -- "$file" | cut -d ' ' -f 1)"
            existing=$(gh release view "$GITHUB_REF_NAME" --json assets \
              --jq ".assets[] | select(.name == \"$file\") | .digest")
            if [[ -n $existing ]]; then
              if [[ $existing != "$digest" ]]; then
                echo "Existing release asset has different bytes: $file" >&2
                exit 1
              fi
              echo "Verified existing release asset: $file"
            else
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done

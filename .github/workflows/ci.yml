name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-protocol:
    name: Rust protocol and plugin adapters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked --bin agenturm-fixture-plugin
      - run: cargo build --locked --bin agenturm-sample-harness
      - run: cargo build --locked --bin agenturm-pi-harness
      - run: cargo build --locked --bin agenturm-codex-harness
      - run: cargo build --locked --bin agenturm-claude-harness
      - run: cargo build --locked --bin agenturm-kiro-harness
      - run: cargo build --locked --bin agenturm-opencode-harness
      - run: cargo build --locked --bin agenturm-plugin-host
      - run: cargo build --locked --bin agenturm
      - name: Stage the Rust app for vendor SDK tests
        run: install -D -m 0755 -s target/debug/agenturm "$RUNNER_TEMP/rust-vendor/agenturm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-vendor-agenturm
          path: ${{ runner.temp }}/rust-vendor/agenturm
          if-no-files-found: error
          retention-days: 3
      - name: Build the independent harness from its own workspace
        working-directory: rust/agenturm-app/tests/fixtures/standalone_harness
        run: |
          cargo fmt -- --check
          cargo build --locked
      - name: Verify the independent process capability and pane
        working-directory: examples/rust_prompt_signals_extension
        run: cargo test --locked
      - name: Verify real Codex ingestion through Rust process host
        run: cargo test --locked -p agenturm-runtime --test codex_process -- --exact codex_process_commits_metadata_usage_then_acknowledges
        env:
          AGENTURM_RUNTIME_PLUGIN_HOST: ${{ github.workspace }}/target/debug/agenturm-plugin-host
          AGENTURM_RUNTIME_CODEX_ADAPTER: ${{ github.workspace }}/target/debug/agenturm-codex-harness
      - name: Verify real Pi usage through injected Rust decoder
        run: cargo test --locked -p agenturm-runtime --test pi_process -- --exact pi_process_uses_injected_decoder_across_commit_retry_and_restart
        env:
          AGENTURM_RUNTIME_PLUGIN_HOST: ${{ github.workspace }}/target/debug/agenturm-plugin-host
          AGENTURM_RUNTIME_PI_ADAPTER: ${{ github.workspace }}/target/debug/agenturm-pi-harness
      # Kiro and OpenCode now exercise their standalone observation format in Rust.
      - name: Verify real Kiro failure ingestion and reopen
        run: cargo test --locked -p agenturm-runtime --test kiro_process
        env:
          AGENTURM_RUNTIME_PLUGIN_HOST: ${{ github.workspace }}/target/debug/agenturm-plugin-host
          AGENTURM_RUNTIME_KIRO_ADAPTER: ${{ github.workspace }}/target/debug/agenturm-kiro-harness
      - name: Verify Claude Code MCP through standalone collection and reopen
        run: cargo test --locked -p agenturm-claude-harness --test configured_mcp
        env:
          AGENTURM_RUNTIME_APP: ${{ github.workspace }}/target/debug/agenturm
          AGENTURM_RUNTIME_PLUGIN_HOST: ${{ github.workspace }}/target/debug/agenturm-plugin-host
      - name: Verify OpenCode checks through standalone collection and reopen
        run: cargo test --locked -p agenturm-opencode-harness --test configured_checks
        env:
          AGENTURM_RUNTIME_APP: ${{ github.workspace }}/target/debug/agenturm
          AGENTURM_RUNTIME_PLUGIN_HOST: ${{ github.workspace }}/target/debug/agenturm-plugin-host
      - name: Verify configured collection, native content grants, and task continuity
        run: cargo test --locked -p agenturm-app --test configured_collection --test prompt_content --test workspace_backup --test adapter_install --test task_cli
        env:
          AGENTURM_RUNTIME_PLUGIN_HOST: ${{ github.workspace }}/target/debug/agenturm-plugin-host
          AGENTURM_RUNTIME_PI_ADAPTER: ${{ github.workspace }}/target/debug/agenturm-pi-harness
          AGENTURM_RUNTIME_CODEX_ADAPTER: ${{ github.workspace }}/target/debug/agenturm-codex-harness
          AGENTURM_RUNTIME_CLAUDE_ADAPTER: ${{ github.workspace }}/target/debug/agenturm-claude-harness
          AGENTURM_RUNTIME_KIRO_ADAPTER: ${{ github.workspace }}/target/debug/agenturm-kiro-harness
          AGENTURM_RUNTIME_OPENCODE_ADAPTER: ${{ github.workspace }}/target/debug/agenturm-opencode-harness
          AGENTURM_RUNTIME_STANDALONE_ADAPTER: ${{ github.workspace }}/rust/agenturm-app/tests/fixtures/standalone_harness/target/debug/standalone-test-harness
      - run: cargo build --locked --bin agenturm-domain-reducer
      - run: cargo build --locked --bin agenturm-domain-query
      - run: cargo build --locked --bin agenturm-backup-query
      - run: cargo build --locked --bin agenturm-storage-service
      - run: cargo build --locked --bin agenturm-storage-admission
      - run: cargo build --locked --bin agenturm-migration-verify
      - run: cargo build --locked --bin agenturm-count-observations
      - run: cargo build --locked --bin agenturm-loopback-inbound-connector
      - run: cargo build --locked -p agenturm-storage-service-contract --example v2_client
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify Node.js producer through the Rust OTLP launcher and receiver
        run: python -m unittest tests.test_rust_javascript_client_e2e -v
        env:
          AGENTURM_RUST_APP_BIN: ${{ github.workspace }}/target/debug/agenturm
      - run: python -m pip install 'opentelemetry-sdk>=1.27,<2'
      - name: Verify Python producer through the Rust OTLP launcher and receiver
        run: python -m unittest tests.test_python_otlp_client tests.test_rust_python_client_e2e -v
        env:
          AGENTURM_RUST_APP_BIN: ${{ github.workspace }}/target/debug/agenturm
      - name: Load the pinned Python 0.2.8 compatibility reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2802d79930728bb331db1d4d718d6dea1c9c374d
          path: .validation/python-028
          persist-credentials: false
      - name: Verify guarded Python receiver Findings and exact Review membership
        run: |
          python scripts/validate_rust_python_findings.py --python-root .validation/python-028 --bin-dir target/debug
          PYTHONPATH=.validation/python-028 python scripts/validate_rust_python_receiver_review.py target/debug/agenturm
      - name: Verify metric description compatibility and retained catalog navigation
        run: |
          python scripts/validate_rust_metric_descriptions.py --app target/debug/agenturm
          python scripts/validate_rust_metric_catalog.py --app target/debug/agenturm
      - name: Verify ordinary OTLP error logs and opt-in text
        run: python scripts/validate_rust_error_logs.py --agenturm target/debug/agenturm
      - name: Verify protected log and current evaluation Finding journeys
        run: |
          python scripts/validate_rust_log_finding_source.py --app target/debug/agenturm
          python scripts/validate_rust_finding_eval_source.py --app target/debug/agenturm
      - run: python -m unittest tests.test_plugin_reference_wire_spi -v
      - run: python -m unittest tests.test_plugin_private_reference_e2e -v
      - run: python -m unittest tests.test_store_writer_lease -v
      - run: python -m unittest tests.test_fake_inbound_connector -v
      - run: python -m unittest tests.test_rust_loopback_inbound_installer -v
        env:
          AGENTURM_RUST_LOOPBACK_INBOUND_BIN: ${{ github.workspace }}/target/debug/agenturm-loopback-inbound-connector
      - run: python -m unittest tests.test_fake_inbound_connector -v
        env:
          AGENTURM_RUST_LOOPBACK_INBOUND_BIN: ${{ github.workspace }}/target/debug/agenturm-loopback-inbound-connector
      - run: python -m unittest tests.test_rust_count_capability_installer -v
      - run: python -m unittest tests.test_declarative_count_capability -v
        env:
          AGENTURM_RUST_COUNT_OBSERVATIONS_BIN: ${{ github.workspace }}/target/debug/agenturm-count-observations
      - run: python -m unittest tests.test_rust_migration_candidate -v
        env:
          AGENTURM_RUST_MIGRATION_VERIFY_BIN: ${{ github.workspace }}/target/debug/agenturm-migration-verify
      - run: python -m unittest tests.test_migration_candidate_producer -v
        env:
          AGENTURM_RUST_MIGRATION_VERIFY_BIN: ${{ github.workspace }}/target/debug/agenturm-migration-verify
      - run: python -m unittest tests.test_cooperating_candidate -v
        env:
          AGENTURM_RUST_MIGRATION_VERIFY_BIN: ${{ github.workspace }}/target/debug/agenturm-migration-verify
      - run: python -m unittest tests.test_rust_plugin_fixture -v
        env:
          AGENTURM_RUST_FIXTURE_BIN: ${{ github.workspace }}/target/debug/agenturm-fixture-plugin
      - run: python -m unittest tests.test_rust_sample_harness_plugin -v
        env:
          AGENTURM_RUST_SAMPLE_BIN: ${{ github.workspace }}/target/debug/agenturm-sample-harness
      - run: python -m unittest tests.test_rust_pi_harness_plugin -v
        env:
          AGENTURM_RUST_PI_BIN: ${{ github.workspace }}/target/debug/agenturm-pi-harness
      - run: python -m unittest tests.test_rust_codex_harness_plugin tests.test_rust_codex_directory_plugin tests.test_plugin_discovery -v
        env:
          AGENTURM_RUST_CODEX_BIN: ${{ github.workspace }}/target/debug/agenturm-codex-harness
      - run: python -m unittest tests.test_rust_claude_harness_plugin tests.test_rust_opencode_harness_plugin -v
        env:
          AGENTURM_RUST_CLAUDE_BIN: ${{ github.workspace }}/target/debug/agenturm-claude-harness
          AGENTURM_RUST_OPENCODE_BIN: ${{ github.workspace }}/target/debug/agenturm-opencode-harness
      - run: python -m unittest tests.test_rust_plugin_host -v
        env:
          AGENTURM_RUST_PLUGIN_HOST_BIN: ${{ github.workspace }}/target/debug/agenturm-plugin-host
          AGENTURM_RUST_SAMPLE_BIN: ${{ github.workspace }}/target/debug/agenturm-sample-harness
      - run: python -m unittest tests.test_rust_domain_reducer tests.test_rust_domain_reducer_v2 tests.test_rust_domain_reducer_v3 tests.test_rust_shadow_snapshot -v
        env:
          AGENTURM_RUST_REDUCER_BIN: ${{ github.workspace }}/target/debug/agenturm-domain-reducer
      - run: python -m unittest tests.test_rust_domain_query -v
        env:
          AGENTURM_RUST_QUERY_BIN: ${{ github.workspace }}/target/debug/agenturm-domain-query
      - run: python -m unittest tests.test_rust_backup_query -v
        env:
          AGENTURM_RUST_BACKUP_QUERY_BIN: ${{ github.workspace }}/target/debug/agenturm-backup-query
      - run: python -m unittest tests.test_rust_storage_service -v
        env:
          AGENTURM_RUST_STORAGE_SERVICE_BIN: ${{ github.workspace }}/target/debug/agenturm-storage-service
      - run: python -m unittest tests.test_rust_scratch_admission -v
        env:
          AGENTURM_RUST_SCRATCH_ADMISSION_BIN: ${{ github.workspace }}/target/debug/agenturm-storage-admission
      - run: python -m unittest tests.test_rust_clone_admission_port -v
        env:
          AGENTURM_RUST_METADATA_ADAPTER_BIN: ${{ github.workspace }}/target/debug/agenturm-storage-admission
      - run: python -m unittest tests.test_rust_plugin_reference_admission -v
        env:
          AGENTURM_RUST_METADATA_ADAPTER_BIN: ${{ github.workspace }}/target/debug/agenturm-storage-admission
      - name: Prove distinct storage service and client accounts
        run: sudo -n /usr/bin/python3 scripts/validate_rust_storage_service_accounts.py --bin target/debug/agenturm-storage-service
      - name: Demonstrate held-open legacy SQLite writer hazard
        run: sudo -n /usr/bin/python3 scripts/validate_legacy_held_open_writer.py
      - name: Exercise pinned v0.2.8 Store and CLI against protected paths
        run: sudo -n /usr/bin/python3 scripts/validate_legacy_held_open_writer.py --release-wheel tests/fixtures/legacy/agenturm-0.2.8-py3-none-any.whl
      - name: Prove experimental v2 scratch dispatch across accounts
        run: sudo -n /usr/bin/python3 scripts/validate_rust_storage_service_v2_accounts.py --bin target/debug/agenturm-storage-service --rust-client-bin target/debug/examples/v2_client
      - name: Prove detached real Store activation across accounts
        run: sudo -n env PYTHONPATH=${{ github.workspace }} /usr/bin/python3 scripts/validate_rust_real_clone_activation.py --bin target/debug/agenturm-storage-service
      - name: Prove Rust Codex fact admission on a detached Store clone
        run: sudo -n env PYTHONPATH=${{ github.workspace }} /usr/bin/python3 scripts/validate_rust_real_clone_admission.py --bin target/debug/agenturm-storage-service --codex-bin target/debug/agenturm-codex-harness

  rust-host-linux-wheel:
    name: Linux x86_64 Rust host wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo build --release --locked -p agenturm-plugin-host -p agenturm-sample-harness
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.7.8
      - run: uv build --wheel --out-dir dist/native
        env:
          AGENTURM_BUNDLE_RUST_HOST: ${{ github.workspace }}/target/release/agenturm-plugin-host
      - run: uv build --wheel --out-dir dist/pure
      - run: >-
          python scripts/validate_linux_rust_host_wheel.py
          --native-wheel dist/native/*.whl
          --pure-wheel dist/pure/*.whl
          --adapter-bin target/release/agenturm-sample-harness
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-rust-host-wheel
          path: dist/native/*.whl
          if-no-files-found: error
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest tests.test_storage_mutation_route_inventory -v
      - run: python -m unittest discover -s tests -v
      - run: python -m observatory --help

  javascript:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --check clients/javascript/index.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: python -m unittest tests.test_javascript_client_e2e -v

  otlp-interoperability:
    name: OpenTelemetry OTLP end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[auto]'
      - run: python -m unittest tests.test_otel_export_e2e -v

  pydantic-ai-interoperability:
    needs: rust-protocol
    name: Pydantic AI native instrumentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[auto]' 'pydantic-ai>=2,<3'
      - run: python -m unittest tests.test_pydantic_ai_otel_e2e -v
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-vendor-agenturm
          path: ${{ runner.temp }}/rust-vendor
      - run: chmod 0755 "$RUNNER_TEMP/rust-vendor/agenturm"
      - name: Verify SDK traces through the Rust OTLP launcher
        run: >-
          python -m unittest -v
          tests.test_rust_vendor_sdk_e2e.RustVendorSdkTests.test_pydantic_ai_native_instrumentation_flushes_model_and_tool_spans
          tests.test_rust_telemetry_payloads.RustTelemetryPayloadTests.test_pydantic_ai_model_text
        env:
          AGENTURM_RUST_APP_BIN: ${{ runner.temp }}/rust-vendor/agenturm
          AGENTURM_REQUIRE_VENDOR_SDK_TESTS: "1"

  google-adk-interoperability:
    needs: rust-protocol
    name: Google ADK OTLP interoperability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[auto]' 'google-adk[mcp]>=1.17,<3'
      - run: python -m unittest tests.test_google_adk_otel_e2e -v
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-vendor-agenturm
          path: ${{ runner.temp }}/rust-vendor
      - run: chmod 0755 "$RUNNER_TEMP/rust-vendor/agenturm"
      - name: Verify SDK traces through the Rust OTLP launcher
        run: >-
          python -m unittest -v
          tests.test_rust_vendor_sdk_e2e.RustVendorSdkTests.test_google_adk_native_instrumentation_flushes_agent_and_tool_spans
          tests.test_rust_telemetry_payloads.RustTelemetryPayloadTests.test_google_adk_model_text
        env:
          AGENTURM_RUST_APP_BIN: ${{ runner.temp }}/rust-vendor/agenturm
          AGENTURM_REQUIRE_VENDOR_SDK_TESTS: "1"

  openai-agents-interoperability:
    needs: rust-protocol
    name: OpenAI Agents SDK local tracing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[openai-agents]'
      - run: python -m unittest tests.test_openai_agents_export_e2e -v
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-vendor-agenturm
          path: ${{ runner.temp }}/rust-vendor
      - run: chmod 0755 "$RUNNER_TEMP/rust-vendor/agenturm"
      - name: Verify SDK traces through the Rust OTLP launcher
        run: >-
          python -m unittest -v
          tests.test_rust_vendor_sdk_e2e.RustVendorSdkTests.test_openai_agents_real_tool_workflow_preserves_normalized_sdk_identity
          tests.test_rust_telemetry_payloads.RustTelemetryPayloadTests.test_openai_agents_model_text
        env:
          AGENTURM_RUST_APP_BIN: ${{ runner.temp }}/rust-vendor/agenturm
          AGENTURM_REQUIRE_VENDOR_SDK_TESTS: "1"

  langchain-interoperability:
    needs: rust-protocol
    name: LangChain callback interoperability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[auto,langchain]' 'langchain-openai>=1.4,<2' 'langgraph>=1.2,<2'
      - run: python -m unittest tests.test_langchain_callback_e2e -v
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-vendor-agenturm
          path: ${{ runner.temp }}/rust-vendor
      - run: chmod 0755 "$RUNNER_TEMP/rust-vendor/agenturm"
      - name: Verify SDK traces through the Rust OTLP launcher
        run: >-
          python -m unittest -v
          tests.test_rust_vendor_sdk_e2e.RustVendorSdkTests.test_langchain_automatic_instrumentation_preserves_its_callback_hierarchy
          tests.test_rust_vendor_sdk_e2e.RustVendorSdkTests.test_langgraph_real_callbacks_retain_graph_node_and_model_spans
          tests.test_rust_telemetry_payloads.RustTelemetryPayloadTests.test_langchain_model_message_text
          tests.test_rust_telemetry_payloads.RustTelemetryPayloadTests.test_langgraph_callback_model_text
        env:
          AGENTURM_RUST_APP_BIN: ${{ runner.temp }}/rust-vendor/agenturm
          AGENTURM_REQUIRE_VENDOR_SDK_TESTS: "1"

  automatic-capture-interoperability:
    needs: rust-protocol
    name: Automatic SDK capture through CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[auto]' 'openai>=1.68,<3' 'anthropic>=1.8,<2' 'langchain-core>=0.3.9,<2'
      - run: python -m unittest tests.test_auto_launcher_e2e -v
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-vendor-agenturm
          path: ${{ runner.temp }}/rust-vendor
      - run: chmod 0755 "$RUNNER_TEMP/rust-vendor/agenturm"
      - name: Verify SDK traces through the Rust OTLP launcher
        run: >-
          python -m unittest -v

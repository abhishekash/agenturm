name: Rust macOS Apple Silicon bundle

on:
  pull_request:
  push:
    branches: [main]
    tags: ["rust-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  candidate:
    name: Build native Apple Silicon candidate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build candidate bundle on native arm64
        shell: bash
        run: |
          set -euo pipefail
          [[ $(uname -m) == arm64 ]]
          scripts/build-rust-macos-bundle.sh "$RUNNER_TEMP/agenturm-macos-bundle"
          archive=("$RUNNER_TEMP"/agenturm-macos-bundle/agenturm-*-macos-aarch64.tar.gz)
          [[ ${#archive[@]} -eq 1 ]]
          (cd "$(dirname "${archive[0]}")" && shasum -a 256 --check "$(basename "${archive[0]}").sha256")
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "${archive[0]}" -C "$RUNNER_TEMP/unpacked"
          bundle=("$RUNNER_TEMP"/unpacked/agenturm-*-macos-aarch64)
          [[ ${#bundle[@]} -eq 1 ]]
          grep -q '"minimum_macos": "13.0"' "${bundle[0]}/release-metadata.json"
          for binary in "${bundle[0]}"/bin/*; do
            [[ $(lipo -archs "$binary") == arm64 ]]
            vtool -show-build "$binary" | grep -q 'minos 13.0'
          done
          scripts/verify-rust-macos-candidate.sh "${archive[0]}"
          git rev-parse HEAD > "$RUNNER_TEMP/agenturm-macos-bundle/source-commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agenturm-rust-macos-aarch64-candidate
          path: ${{ runner.temp }}/agenturm-macos-bundle/
          if-no-files-found: error
          compression-level: 0

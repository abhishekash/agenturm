name: Rust macOS Apple Silicon bundle

on:
  pull_request:
  push:
    branches: [main]
    tags: ["rust-v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  candidate:
    name: Build native Apple Silicon candidate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build candidate bundle on native arm64
        shell: bash
        run: |
          set -euo pipefail
          [[ $(uname -m) == arm64 ]]
          scripts/build-rust-macos-bundle.sh "$RUNNER_TEMP/agenturm-macos-bundle"
          archive=("$RUNNER_TEMP"/agenturm-macos-bundle/agenturm-*-macos-aarch64.tar.gz)
          [[ ${#archive[@]} -eq 1 ]]
          (cd "$(dirname "${archive[0]}")" && shasum -a 256 --check "$(basename "${archive[0]}").sha256")
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "${archive[0]}" -C "$RUNNER_TEMP/unpacked"
          bundle=("$RUNNER_TEMP"/unpacked/agenturm-*-macos-aarch64)
          [[ ${#bundle[@]} -eq 1 ]]
          grep -q '"minimum_macos": "13.0"' "${bundle[0]}/release-metadata.json"
          for binary in "${bundle[0]}"/bin/*; do
            [[ $(lipo -archs "$binary") == arm64 ]]
            vtool -show-build "$binary" | grep -q 'minos 13.0'
          done
          scripts/verify-rust-macos-candidate.sh "${archive[0]}"
          scripts/verify-rust-macos-install.sh "${archive[0]}"
          git rev-parse HEAD > "$RUNNER_TEMP/agenturm-macos-bundle/source-commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agenturm-rust-macos-aarch64-candidate
          path: ${{ runner.temp }}/agenturm-macos-bundle/
          if-no-files-found: error
          compression-level: 0

  publish-macos:
    name: Attach qualified macOS Apple Silicon release archive
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/rust-v')
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agenturm-rust-macos-aarch64-candidate
          path: release
      - name: Attach the exact qualified archive without replacing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          asset="agenturm-${GITHUB_REF_NAME#rust-v}-macos-aarch64.tar.gz"
          [[ -f $asset && -f $asset.sha256 && -f source-commit.txt ]]
          sha256sum --check "$asset.sha256"
          expected_commit=$(cat source-commit.txt)
          [[ $expected_commit =~ ^[0-9a-f]{40}$ ]]
          live_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          [[ $live_commit == "$expected_commit" ]] || {
            echo 'Release tag moved after macOS archive qualification' >&2
            exit 1
          }
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --latest=false \
              --title "Agenturm Rust ${GITHUB_REF_NAME#rust-v}" \
              --notes 'Native Linux and Apple Silicon archives. Apple Silicon requires macOS 13+; Intel Macs are not supported.' \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          for file in "$asset" "$asset.sha256"; do
            digest="sha256:$(sha256sum -- "$file" | cut -d ' ' -f 1)"
            existing=$(gh release view "$GITHUB_REF_NAME" --json assets \
              --jq ".assets[] | select(.name == \"$file\") | .digest")
            if [[ -n $existing ]]; then
              [[ $existing == "$digest" ]] || {
                echo "Existing release asset has different bytes: $file" >&2
                exit 1
              }
              echo "Verified existing release asset: $file"
            else
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done

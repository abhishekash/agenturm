[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agenturm"
version = "0.1.4"
description = "Terminal-first monitor for AI agent sessions, MCP calls, OpenTelemetry traces, and errors."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "observability", "opentelemetry", "otlp", "tracing", "mcp", "codex", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = ["textual>=8.2,<9"]

[project.urls]
Homepage = "https://github.com/abhishekash/agenturm"
Documentation = "https://github.com/abhishekash/agenturm/blob/main/docs/usage.md"
Repository = "https://github.com/abhishekash/agenturm"
Issues = "https://github.com/abhishekash/agenturm/issues"
Changelog = "https://github.com/abhishekash/agenturm/releases"

[project.optional-dependencies]
auto = [
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "openinference-instrumentation-openai>=0.1",
    "openinference-instrumentation-anthropic>=0.1",
    "openinference-instrumentation-langchain>=0.1",
]
langchain = ["langchain-core>=0.3.9,<2"]
openai-agents = ["openai-agents>=0.1.0,<2"]

[project.scripts]
agenturm = "observatory.__main__:main"

[tool.setuptools.exclude-package-data]
observatory = ["*.html", "*.js", "*.css"]

[tool.setuptools.packages.find]
include = ["observatory*"]

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Agenturm — know what your agents are doing</title>
<desc id="desc">Local observability for Codex, Claude Code, OpenCode, Pi, and OpenTelemetry agents. A Berlin TV Tower-inspired observation tower includes a magnifying lens, representing a closer look at recorded agent work.</desc>

<defs>
  <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#30223d"/><stop offset="1" stop-color="#121018"/></linearGradient>
  <radialGradient id="dawn"><stop stop-color="#ffbd69" stop-opacity=".12"/><stop offset="1" stop-color="#ffbd69" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="420" rx="28" fill="url(#sky)"/>
<circle cx="1060" cy="170" r="230" fill="url(#dawn)"/>
<path d="M1114 72V350M1154 98V350M1194 72V350M1082 130h144M1082 205h144M1082 280h144" fill="none" stroke="#67516d" stroke-width="2" opacity=".6"/>
<path d="M64 55h30" stroke="#ffbd69" stroke-width="3"/>
  <text x="106" y="61" fill="#b9afc5" font-family="DejaVu Sans Mono,monospace" font-size="13" letter-spacing="3">LOCAL OBSERVABILITY FOR CODING AGENTS</text>
<!-- Match the website header: its outlined observation tower and lowercase wordmark. -->
<g transform="translate(61 78) scale(.62)" fill="none" stroke="#f6f0e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 3v17M17.5 20h5M18 35l-3 32h10l-3-32M10 68h20M20 4h2M18 11h4"/>
  <ellipse cx="20" cy="28" rx="11" ry="8"/>
  <path d="M9 28h22M12 32h16M20 20v16"/>
  <circle cx="20" cy="3" r="2" fill="#c5adff" stroke="none"/>
</g>
<text x="94" y="112" fill="#f6f0e8" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" letter-spacing="0">agenturm</text>
<text x="238" y="112" fill="#b9afc5" font-family="DejaVu Sans,Arial,sans-serif" font-size="20">.dev</text>
<text x="58" y="198" fill="#f6f0e8" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="65" letter-spacing="0">Know what your</text>
<text x="58" y="274" fill="#ffbd69" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="65" letter-spacing="0">agents are doing.</text>
<text x="64" y="333" fill="#f6f0e8" font-family="DejaVu Sans,Arial,sans-serif" font-size="23">See recorded progress. Inspect tool calls. Follow traces.</text>
<text x="65" y="383" fill="#b9afc5" font-family="DejaVu Sans Mono,monospace" font-size="14">CODEX  /  CLAUDE CODE  /  OPENCODE  /  PI  /  OTEL</text>
<g transform="translate(932 49) scale(3.9)" fill="none" stroke="#f6f0e8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".92">

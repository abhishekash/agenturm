<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Agenturm social card</title>
<desc id="desc">A Berlin TV Tower-inspired broadcast tower with a lavender-purple spherical deck, a central magnifying glass, one thin observation band, a slender amber mast, and a banded antenna.</desc>

<rect width="1280" height="640" fill="#121018"/>
<g transform="translate(470 22) scale(.66)">

  <!-- Berlin's distinctive proportions: antenna, spherical deck, slim mast. -->
  <path d="M252 62h8v28h-8Z M248 110h16v34h-16Z" fill="#ffbd69"/>
  <path d="M250 90h12v20h-12Z" fill="#f6f0e8"/>
  <path d="M249 258h14l12 168h-38Z M218 426h76v10h-76Z" fill="#ffbd69"/>
  <!-- A circular deck split by one thin band below the central hand lens. -->
  <!-- The band and lens are true cutouts, not painted background rectangles. -->
  <path fill="#c5adff" fill-rule="evenodd" d="
    M201.741 232a62 62 0 1 1 108.518 0Z
    M205.522 238h100.956a62 62 0 0 1-100.956 0Z
    M266.41 206.75l14.42 14.42-5.66 5.66-14.42-14.42a21 21 0 1 1 5.66-5.66Z
    M262 195a13 13 0 1 0-26 0 13 13 0 1 0 26 0Z
  "/>
</g>
<text x="640" y="428" fill="#f6f0e8" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="62">Agenturm</text>
<text x="640" y="488" fill="#c5adff" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="28">A clear view of every agent.</text>
<text x="640" y="568" fill="#b9afc5" text-anchor="middle" font-family="DejaVu Sans Mono,monospace" font-size="17">LOCAL OBSERVABILITY  /  RIGHT IN YOUR TERMINAL</text>

</svg>
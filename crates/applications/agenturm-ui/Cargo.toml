[package]
name = "agenturm-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
agenturm-kernel = { path = "../../core/agenturm-kernel" }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1.0"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "termios"] }

[dev-dependencies]
agenturm-lifecycle-extension-fixture = { path = "../../test-support/plugins/lifecycle-extension" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.6", features = ["pipe"] }

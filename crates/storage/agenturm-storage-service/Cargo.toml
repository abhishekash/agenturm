[package]
name = "agenturm-storage-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
agenturm-kernel = { path = "../../core/agenturm-kernel" }
agenturm-storage-admission = { path = "../agenturm-storage-admission" }
agenturm-storage-service-contract = { path = "../agenturm-storage-service-contract" }
agenturm-store = { path = "../agenturm-store" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
agenturm-content = { path = "../../plugins/host/agenturm-content" }
agenturm-runtime = { path = "../../plugins/host/agenturm-runtime" }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10"

[[bin]]
name = "agenturm-storage-service"
path = "src/main.rs"

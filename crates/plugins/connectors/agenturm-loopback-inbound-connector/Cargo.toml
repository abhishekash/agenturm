[package]
name = "agenturm-loopback-inbound-connector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "agenturm-loopback-inbound-connector"
path = "src/main.rs"

[dependencies]
agenturm-source-process = { path = "../../host/agenturm-source-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"

[package]
name = "agenturm-content"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
[dependencies]
agenturm-kernel = { path = "../../../core/agenturm-kernel" }
agenturm-store = { path = "../../../storage/agenturm-store" }
agenturm-jsonl-source = { path = "../agenturm-jsonl-source" }
agenturm-opencode-harness = { path = "../../harnesses/agenturm-opencode-harness" }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2.0"
time = { version = "0.3", features = ["parsing"] }
